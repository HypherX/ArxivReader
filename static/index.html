<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArxivReader · 文献管理</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 顶栏：品牌 / 添加论文 / 布局切换 / 全局操作 -->
  <header id="topbar">
    <div class="brand"><span class="logo">📚</span><span class="bname">ArxivReader</span><span class="btag">文献管理</span></div>
    <div class="add-box">
      <input id="new-url" type="text" placeholder="粘贴 ArXiv 链接或 ID（如 2401.12345），回车入库…" autocomplete="off" />
      <select id="target-folder" title="选择目标文件夹，或按规则自动归档"></select>
      <button id="add-btn" class="primary">添加</button>
    </div>
    <div class="layout-toggles" title="显示 / 隐藏各面板">
      <button class="lt" data-pane="sidebar" title="文件夹栏">📁</button>
      <button class="lt" data-pane="list" title="论文列表">📄</button>
      <button class="lt" data-pane="viewer" title="PDF 预览">👁</button>
      <button class="lt" data-pane="chat" title="对话栏">💬</button>
    </div>
    <div class="top-actions">
      <button id="open-rules" class="ghost">归档规则</button>
      <button id="open-settings" class="ghost">设置</button>
    </div>
  </header>

  <div id="toast" class="toast hidden"></div>

  <!-- 三/四栏主体（含可拖拽分隔条） -->
  <main id="layout">
    <!-- 左：文件夹树 -->
    <aside id="sidebar" class="pane" data-pane="sidebar">
      <div class="side-head">
        <span>文件夹</span>
        <span class="side-head-ops">
          <button id="new-folder" class="mini" title="新建顶层文件夹">＋</button>
          <button class="mini pane-hide" data-hide="sidebar" title="隐藏此栏">«</button>
        </span>
      </div>
      <div id="folder-all" class="folder-row all selected">
        <span class="fname">全部论文</span><span class="count" id="all-count">0</span>
      </div>
      <div id="folder-tree"></div>
    </aside>
    <div class="resizer" id="rz-sidebar" data-for="sidebar" title="拖拽调整宽度"></div>

    <!-- 中：论文列表 + PDF 预览 -->
    <section id="center">
      <div id="list-pane" class="pane" data-pane="list">
        <div class="pane-head">
          <span>论文</span>
          <button class="mini pane-hide" data-hide="list" title="隐藏此栏">«</button>
        </div>
        <input id="search" type="text" placeholder="搜索标题 / 摘要 / 作者…" autocomplete="off" />
        <div id="paper-list"></div>
      </div>
      <div class="resizer" id="rz-list" data-for="list" title="拖拽调整宽度"></div>
      <div id="viewer-pane" class="pane" data-pane="viewer">
        <div id="viewer-toolbar" class="viewer-toolbar hidden">
          <span id="viewer-title" class="v-title"></span>
          <span class="v-ops">
            <button id="move-paper" class="mini" title="移动到其它文件夹">📁 移动</button>
            <button id="reextract-paper" class="mini" title="重新抽取 PDF 全文">↻ 重抽全文</button>
            <button id="delete-paper" class="mini danger" title="从库中删除">🗑 删除</button>
            <button class="mini pane-hide" data-hide="viewer" title="隐藏此栏">«</button>
          </span>
        </div>
        <div id="viewer-body">
          <div id="viewer-empty" class="empty">选择一篇论文以预览 PDF</div>
          <iframe id="pdf-frame" class="hidden" title="PDF 预览"></iframe>
        </div>
      </div>
    </section>

    <div class="resizer" id="rz-chat" data-for="chat" title="拖拽调整宽度"></div>

    <!-- 右：对话阅读 -->
    <aside id="chat-pane" class="pane" data-pane="chat">
      <div id="chat-head">
        <div class="chat-head-top">
          <div id="chat-title">未选择论文</div>
          <button class="mini pane-hide" data-hide="chat" title="隐藏此栏">»</button>
        </div>
        <div id="ctx-status" class="ctx-status hidden"></div>
        <div class="chat-head-actions">
          <select id="session-select" title="切换会话"></select>
          <button id="new-session" class="mini" title="新建会话">＋</button>
        </div>
      </div>
      <div id="messages">
        <div class="empty">选择论文并开始一次对话，就论文内容向 LLM 提问。</div>
      </div>
      <div id="chat-input-row">
        <textarea id="chat-input" rows="2" placeholder="就这篇论文提问…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send-btn" class="primary">发送</button>
      </div>
    </aside>
  </main>

  <!-- 移动论文弹窗 -->
  <div id="move-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><span>移动论文到文件夹</span><button class="mini" data-close="move-modal">✕</button></div>
      <div class="modal-body">
        <div class="hint" id="move-paper-title"></div>
        <label>目标文件夹<select id="move-folder"></select></label>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button class="ghost" data-close="move-modal">取消</button>
        <button id="move-confirm" class="primary">移动</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><span>LLM 设置（OpenAI 兼容）</span><button class="mini" data-close="settings-modal">✕</button></div>
      <div class="modal-body">
        <label>API Base URL<input id="set-base-url" type="text" placeholder="https://api.openai.com/v1" /></label>
        <label>API Key<input id="set-api-key" type="password" placeholder="留空表示不修改" autocomplete="off" /></label>
        <div class="hint" id="key-hint"></div>
        <label>模型名称<input id="set-model" type="text" placeholder="gpt-4o-mini / qwen-plus / deepseek-chat" /></label>
        <div class="row">
          <label>temperature<input id="set-temperature" type="number" step="0.1" min="0" max="2" /></label>
          <label>max_tokens<input id="set-max-tokens" type="number" step="256" min="1" /></label>
          <label>top_p<input id="set-top-p" type="number" step="0.05" min="0" max="1" /></label>
        </div>
        <div class="hint" id="settings-test-result"></div>
      </div>
      <div class="modal-foot">
        <button id="test-llm" class="ghost">测试连接</button>
        <span class="spacer"></span>
        <button class="ghost" data-close="settings-modal">取消</button>
        <button id="save-settings" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 规则弹窗 -->
  <div id="rules-modal" class="modal hidden">
    <div class="modal-card wide">
      <div class="modal-head"><span>自动归档规则</span><button class="mini" data-close="rules-modal">✕</button></div>
      <div class="modal-body">
        <p class="hint">入库论文若未手动指定文件夹，则按 priority 升序匹配下列启用规则，首条命中即归档；都不命中则进入 Inbox。</p>
        <div class="rule-form">
          <input id="rule-name" type="text" placeholder="规则名（可选）" />
          <select id="rule-type">
            <option value="category">分类 category</option>
            <option value="keyword">关键词 keyword</option>
            <option value="author">作者 author</option>
            <option value="title">标题 title</option>
          </select>
          <input id="rule-pattern" type="text" placeholder="匹配值，如 cs.CL / diffusion / Bengio" />
          <select id="rule-folder"></select>
          <input id="rule-priority" type="number" value="100" title="priority，越小越先" />
          <button id="add-rule" class="primary">添加规则</button>
        </div>
        <div id="rule-list"></div>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button class="ghost" data-close="rules-modal">关闭</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
