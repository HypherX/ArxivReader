name: Desktop Builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2022
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build local application
        run: python tools/build_desktop.py
      - name: Store unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArxivReader-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.json
          if-no-files-found: error
